services:
  walters-mcp-server:
    build: .
    ports:
      - "${HOST_PORT:-8081}:8080"
    environment:
      PORT: "8080"
      TIME_ZONE: ${TIME_ZONE:-America/Toronto}
      DW_API_BASE_URL: ${DW_API_BASE_URL:?DW_API_BASE_URL must be set (see .env)}
      DW_API_USERNAME: ${DW_API_USERNAME:?DW_API_USERNAME must be set (see .env)}
      DW_API_PASSWORD: ${DW_API_PASSWORD:?DW_API_PASSWORD must be set (see .env)}
      DW_API_TIMEOUT_MS: ${DW_API_TIMEOUT_MS:-60000}
      MCP_BASIC_AUTH_USERNAME: ${MCP_BASIC_AUTH_USERNAME:?MCP_BASIC_AUTH_USERNAME must be set (see .env)}
      MCP_BASIC_AUTH_PASSWORD: ${MCP_BASIC_AUTH_PASSWORD:?MCP_BASIC_AUTH_PASSWORD must be set (see .env)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    # Lets the container reach a DataWarehouse-API published on this Docker host's own port via
    # http://host.docker.internal:<port> - Docker Desktop provides this name; Linux needs it mapped.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
